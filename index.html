<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: #1a1a2e;
            --poster-color: #1a1a2e;
        }
        model-viewer#viewer::part(default-progress-bar) {
            background-color: #e94560;
            height: 4px;
        }
        #error-msg {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e94560;
            font-size: 1.2rem;
            text-align: center;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 2rem 3rem;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div id="error-msg">Failed to load 3D model.<br>Check that the .glb file exists.</div>

    <model-viewer
        id="viewer"
        src="VulcanSUV.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        shadow-softness="0.5"
        camera-orbit="45deg 55deg auto"
        environment-image="neutral"
        tone-mapping="commerce"
        touch-action="pan-y"
        loading="eager"
        alt="3D model viewer">
    </model-viewer>

    <script>
        const viewer = document.getElementById('viewer');
        viewer.addEventListener('error', () => {
            document.getElementById('error-msg').style.display = 'block';
        });
    </script>

</body>
</html>
