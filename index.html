<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My GitHub 3D Model Viewer</title>
    <!-- Import the model-viewer component JavaScript -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #222; }
        model-viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <!-- Link the src attribute to your .glb file path -->
    <model-viewer 
        src="my-model.glb" 
        ar 
        camera-controls 
        touch-action="pan-y" 
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
